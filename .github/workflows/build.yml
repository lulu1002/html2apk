name: Build APK (Dev Toolbox)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Instala o Gradle diretamente (nao precisa do gradle-wrapper.jar no repositorio)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Enviar APKs
        uses: actions/upload-artifact@v4
        with:
          name: devtools-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
