plugins { id 'com.android.application' }

android {
    namespace 'com.greentube.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.greentube.app'
        minSdk 26
        targetSdk 34
        // sobe sozinho a cada build no GitHub Actions (o Android exige que nunca diminua)
        versionCode 100 + Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName '1.3.1'
    }

    // Assinatura FIXA: toda versão sai com a mesma chave, então atualiza por cima sem desinstalar.
    signingConfigs {
        devtube {
            storeFile file('devtube.keystore')
            storePassword 'devtube-2026'
            keyAlias 'devtube'
            keyPassword 'devtube-2026'
        }
    }
    buildTypes {
        debug   { signingConfig signingConfigs.devtube }
        release { signingConfig signingConfigs.devtube }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
